<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>go asia 做账记录</title>
<style>  :root {
    --kopf:#1f3a5f; --accent:#1f3a5f; --hell:#8EC31F; --rot:#E60013;
    --bg:#ffffff; --panel:#f3f5f8; --line:#dde3ea; --text:#142030; --dim:#66717f;
    --ok:#006935; --warn:#8f5700; --bad:#E60013;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    overscroll-behavior:none; }
  body { display:flex; flex-direction:column;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0); }

  header { display:flex; align-items:center; gap:8px; padding:7px 10px;
    background:var(--kopf); flex:0 0 auto; }
  #logo { height:30px; width:auto; flex:0 0 auto; display:block; }
  header .sp { flex:1; }

  .tag { font-size:12px; padding:3px 8px; border-radius:99px; background:rgba(255,255,255,.18);
    color:#fff; max-width:46vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tag:empty { display:none; }
  #who { min-width:0; }
  #net { flex:0 0 auto; max-width:none; }
  .tag.on { background:var(--hell); color:var(--kopf); font-weight:700; }
  .tag.off { background:var(--rot); color:#fff; font-weight:700; }
  #lang { font-size:12px; font-weight:700; color:#fff; background:rgba(255,255,255,.18);
    border:0; border-radius:99px; padding:5px 10px; }
  #gear { border:0; background:transparent; color:#fff; font-size:18px; padding:2px 4px; }

  #flash { flex:0 0 auto; padding:14px 10px; text-align:center; background:var(--panel);
    border-bottom:1px solid var(--line); color:var(--text); }
  #flash .a { font-size:26px; font-weight:800; line-height:1.15; word-break:break-word; }
  #flash .b { font-size:14px; opacity:.9; margin-top:2px; }
  #flash .b:empty { display:none; }
  #flash.ok { background:var(--ok); color:#fff; }
  #flash.warn { background:var(--warn); color:#fff; }
  #flash.bad { background:var(--bad); color:#fff; }

  nav { display:flex; flex:0 0 auto; background:var(--bg); border-bottom:1px solid var(--line); }
  nav button { flex:1; padding:11px 2px; border:0; background:transparent; color:var(--dim);
    font-size:15px; font-weight:600; border-bottom:3px solid transparent; }
  nav button.sel { color:var(--text); border-bottom-color:var(--accent); }

  #tabTresorZahl { display:inline-block; min-width:20px; padding:0 6px; border-radius:99px; font-size:12px;
    line-height:18px; background:var(--panel); border:1px solid var(--line); color:var(--text); }
  #tabTresorZahl:empty { display:none; }

  main { flex:1 1 auto; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:10px; }
  .hide { display:none !important; }

  .cam { position:relative; background:#000; border-radius:10px; overflow:hidden; margin-bottom:8px; }
  .cam video { width:100%; max-height:34vh; display:block; object-fit:cover; }
  .cam .fr { position:absolute; inset:20% 6%; border:2px solid rgba(255,255,255,.9); border-radius:6px;
    box-shadow:0 0 0 2000px rgba(0,0,0,.3); pointer-events:none; }
  .cam .fr::after { content:""; position:absolute; left:0; right:0; top:50%; height:2px; background:#e53e3e; }

  .camTools { position:absolute; right:8px; bottom:8px; display:flex; gap:6px; }
  .camTools button { border:0; border-radius:8px; padding:6px 11px; font-size:15px; font-weight:800;
    background:rgba(255,255,255,.85); color:var(--text); }
  .camTools button.an { background:var(--hell); color:var(--kopf); }

  .two { display:flex; gap:8px; }
  button.b { flex:1; padding:14px 8px; font-size:16px; font-weight:700; border:0; border-radius:10px;
    background:var(--accent); color:#fff; }
  button.b.g { background:var(--panel); color:var(--text); border:1px solid var(--line); }
  button.b.w { width:100%; }

  button.b.rot { background:var(--rot); }
  button.b[disabled] { opacity:.45; }
  input { width:100%; padding:13px; font-size:17px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--text); margin-top:8px; }
  #cfgCode { font-size:30px; text-align:center; letter-spacing:8px; font-weight:800;
    text-transform:uppercase; font-family:ui-monospace,Menlo,monospace; }

  .big { font-size:34px; font-weight:800; text-align:center; padding:14px 8px 10px;
    background:var(--panel); border:2px solid var(--accent); border-radius:12px;
    margin:2px 0 6px; color:var(--accent); line-height:1.1; word-break:break-word; }
  .big .wt { display:block; font-size:16px; font-weight:700; margin-top:5px; }
  .big.fertig { border-color:var(--ok); color:var(--ok); }
  .zuletzt { display:flex; align-items:center; justify-content:center; gap:8px; min-height:30px;
    font-size:14px; color:var(--dim); }
  .zuletzt button { border:1px solid var(--line); background:var(--panel); color:var(--text);
    border-radius:8px; font-size:17px; padding:1px 12px; }

  .platz { margin:10px 0 0; }

  .karte { background:var(--bg); border:1px solid var(--line); border-radius:12px; overflow:hidden;
    margin-top:10px; }
  .karte:empty { display:none; }

  .kacheln { display:flex; flex-wrap:wrap; gap:8px; padding:10px; }
  .kachel { position:relative; flex:0 0 auto; width:74px; height:74px; border-radius:10px; overflow:hidden; }
  .kachel img { width:100%; height:100%; object-fit:cover; display:block; }
  .kachel .weg { position:absolute; top:3px; right:3px; width:28px; height:28px; border-radius:50%;
    background:rgba(0,0,0,.6); color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1; }
  .kachel.neu { border:2px dashed var(--accent); background:var(--panel); color:var(--accent); padding:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font:inherit; font-size:13px; font-weight:700; }

  .kachel.neu * { pointer-events:none; }

  .liste .row { margin:0; border:0; border-bottom:1px solid var(--line); border-radius:0;
    background:var(--bg); padding:11px 12px; }
  .liste .row:last-child { border-bottom:0; }
  .liste .leer { padding:18px 0; }
  .listenkopf { display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    margin:16px 2px 0; font-size:15px; font-weight:800; }
  .listenkopf span:last-child { color:var(--dim); font-size:14px; font-weight:700; }

  .abseits { margin-top:22px; padding-top:16px; border-top:1px dashed var(--line); }

  .row { display:flex; align-items:center; gap:8px; padding:9px 10px; background:var(--panel);
    border:1px solid var(--line); border-radius:9px; margin-top:6px; font-size:15px; }
  .row .g { flex:1; min-width:0; }
  .row .s { color:var(--dim); font-size:13px; }
  .row .x { color:var(--dim); font-size:22px; padding:0 6px; }
  .row .eur { font-weight:800; white-space:nowrap; }

  .nr { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--dim); word-break:break-all; }
  .nr b { color:var(--text); font-size:16px; }

  .row input.betrag { width:7.2em; flex:0 0 auto; margin:0; padding:9px 10px; text-align:right;
    font-size:18px; font-weight:700; }
  .row input.betrag.falsch { border-color:var(--bad); color:var(--bad); }
  .row .eurz { flex:0 0 auto; font-size:17px; font-weight:700; color:var(--dim); margin-left:-2px; }

  textarea.notiz { display:block; width:100%; margin-top:10px; padding:11px 13px; font:inherit; font-size:16px;
    border-radius:10px; border:1px solid var(--line); background:var(--bg); color:var(--text); resize:none; }
  #dlgNotiz { margin-top:8px; padding:9px 11px; border-radius:9px; background:var(--panel); font-size:15px;
    white-space:pre-wrap; word-break:break-word; }
  #dlgNotiz:empty { display:none; }
  #dlgNotiz b { display:block; font-size:12px; color:var(--dim); }
  .summe { text-align:right; font-weight:800; font-size:17px; padding:8px 4px 2px; }
  .summe:empty { display:none; }
  .leer { text-align:center; color:var(--dim); padding:14px 0; }
  .hint { font-size:12px; color:var(--dim); margin-top:4px; min-height:16px; }
  .lbl { font-size:12px; color:var(--dim); margin-top:10px; }

  @keyframes spin { to { transform:rotate(360deg); } }
  .spin { display:inline-block; width:19px; height:19px; border-radius:50%;
    border:3px solid rgba(255,255,255,.35); border-top-color:#fff;
    animation:spin .8s linear infinite; vertical-align:-4px; }
  button.b.g .spin { border-color:rgba(128,128,128,.35); border-top-color:currentColor; }
  .spin.gross { width:48px; height:48px; border-width:5px; border-color:rgba(31,58,95,.2);
    border-top-color:var(--accent); }

  .spin.dunkel { border-color:rgba(31,58,95,.2); border-top-color:var(--accent); }

  #sperre { position:fixed; inset:0; z-index:45; background:transparent; }
  #app.gesperrt nav, #app.gesperrt main { opacity:.45; }

  #dlg { position:fixed; inset:0; z-index:30; background:rgba(10,20,35,.55); display:flex;
    align-items:center; justify-content:center; padding:14px; }
  #dlg .karte { background:var(--bg); border-radius:14px; padding:14px; width:100%; max-width:440px;
    max-height:92vh; overflow-y:auto; }
  #dlg .dt { text-align:center; font-size:18px; font-weight:800; margin-bottom:6px; }
  #dlg .dt:empty { display:none; }
  #busy { position:fixed; inset:0; z-index:40; background:rgba(255,255,255,.75); display:flex;
    flex-direction:column; gap:14px; align-items:center; justify-content:center; }
  #busy div { font-size:17px; font-weight:800; color:var(--accent); }

</head>
<body>

<header>
  <img id="logo" src="logo.png" alt="go asia">
  <span class="sp"></span>
  <span id="who" class="tag"></span>
  <span id="net" class="tag"></span>
  <button id="lang">DE</button>
  <button id="gear">&#9881;</button>
</header>

<section id="setup" class="hide" style="padding:10px">
  <div id="pairBox">
    <div class="lbl" data-t="code">Code</div>
    <input id="cfgCode" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="6">
    <div style="height:10px"></div>
    <button id="cfgPair" class="b w" data-t="save">OK</button>
  </div>
  <div id="doneBox" class="hide">
    <div class="row"><span class="g" id="meName"></span><span class="s" id="meRole"></span></div>
    <button id="cfgUnpair" class="b g w" data-t="unpair">Abmelden</button>
  </div>
  <div id="cfgMsg" class="hint"></div>
</section>

<div id="app" class="hide" style="display:flex;flex-direction:column;flex:1;min-height:0">
  <div id="flash"><div class="a"></div><div class="b"></div></div>

  <nav id="nav">
    <button data-mode="abr" class="sel" data-t="tabAbr">Abrechnung</button>
    <button data-mode="ueb" data-t="tabUeb">Übergabe</button>
    <button data-mode="tresor"><span data-t="tresor">Tresor</span> <span id="tabTresorZahl"></span></button>
  </nav>

  <main>
    <div id="nurFiliale" class="leer hide" data-t="nurFiliale">Nur für Filialen</div>

    <section id="mAbr">
      <div id="tagKarte" class="big">&ndash;</div>
      <div id="startBox" class="hide">
        <div class="lbl" data-t="startdatum">Startdatum</div>
        <input id="startDatum" type="date">
      </div>
      <div class="zuletzt"><span id="zuletztText"></span><button id="btnLeerZurueck" class="hide" type="button">&#8630;</button></div>
      <div id="platzAbr" class="platz"></div>

      <div id="abrArbeit">
        <div id="abrKopf" class="listenkopf"><span data-t="beutel">Beutel</span><span id="abrSumme"></span></div>
        <div id="abrListe" class="karte liste"></div>
        <div class="listenkopf"><span data-t="material">Belege</span><span id="fotoZahlAbr"></span></div>
        <div id="fotosAbr" class="karte kacheln"></div>
        <div class="listenkopf"><span data-t="notiz">Notiz</span></div>
        <textarea id="notizAbr" class="notiz" rows="2" maxlength="200"></textarea>
        <button id="btnBuchen" class="b w" style="margin-top:12px" data-t="buchen">Buchen</button>
      </div>
      <div id="leerBox" class="abseits">
        <button id="btnLeer" class="b rot w" data-t="leerTag">Kein Geld</button>
      </div>
    </section>

    <section id="mUeb" class="hide">
      <div id="platzUeb" class="platz"></div>
      <div id="uebKopf" class="listenkopf"><span data-t="gescannt">Gescannt</span><span id="uebSumme"></span></div>
      <div id="uebListe" class="karte liste"></div>
      <div id="uebArbeit">
        <div class="listenkopf"><span data-t="material">Belege</span><span id="fotoZahlUeb"></span></div>
        <div id="fotosUeb" class="karte kacheln"></div>
        <div class="listenkopf"><span data-t="notiz">Notiz</span></div>
        <textarea id="notizUeb" class="notiz" rows="2" maxlength="200"></textarea>
        <button id="btnUebBuchen" class="b w" style="margin-top:12px" data-t="uebBuchen">Übergabe buchen</button>
      </div>
    </section>

    <section id="mTresor" class="hide">
      <div class="listenkopf"><span data-t="tresor">Tresor</span><span id="tresorZahl"></span></div>
      <div id="tresorListe" class="karte liste"></div>
    </section>

    <div id="scanBox">
      <div class="cam hide" id="cam"><video id="video" playsinline muted autoplay></video><div class="fr"></div>
        <div class="camTools"><button id="btnZoom" class="hide" type="button">2&times;</button><button id="btnTorch" class="hide" type="button">&#128294;</button></div>
      </div>
      <div class="two">
        <button id="btnCam" class="b" data-t="cam">Scannen</button>
        <button id="btnShot" class="b g" data-t="photo">Foto-Code</button>
      </div>
      <input id="photo" type="file" accept="image/*" capture="environment" class="hide">
      <form id="manForm" autocomplete="off"><input id="manual" type="text" inputmode="numeric"></form>
      <div id="manHint" class="hint"></div>
    </div>

    <div style="height:14px"></div>
    <button id="btnLaden" class="b g w" data-t="reload">Laden</button>
  </main>
</div>

<input id="kameraEin" type="file" accept="image/*" capture="environment" class="hide">
<input id="albumEin" type="file" accept="image/*" multiple class="hide">

<div id="dlg" class="hide">
  <div class="karte">
    <div id="dlgTitel" class="dt"></div>
    <div id="dlgGross" class="big"></div>
    <div id="dlgListe"></div>
    <div id="dlgSumme" class="summe"></div>
    <div id="dlgNotiz"></div>
    <div class="two" style="margin-top:12px">
      <button id="dlgNein" class="b g" data-t="cancel">Abbrechen</button>
      <button id="dlgJa" class="b">OK</button>
    </div>
  </div>
</div>
<div id="sperre" class="hide"></div>
<div id="busy" class="hide"><span class="spin gross"></span><div data-t="sendet">Wird gebucht</div></div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js">
</script>

var ENTSPIEGEL_K = 5;

  for (y = 0; y < h; y++) {

  for (y = 0; y < h; y++) {
    y0 = Math.max(0, y - r); y1 = Math.min(h - 1, y + r);
    for (x = 0; x < w; x++) {
      m = 0;

    try {
      new ZXing.BrowserMultiFormatReader(hints()).decodeFromImageElement(img)
        .then(function (r) { URL.revokeObjectURL(img.src); wartenAus(); onScan(r.getText()); })
        .catch(function () { URL.revokeObjectURL(img.src); flashT('bad', 'noRead'); });
    } catch (e) {

      URL.revokeObjectURL(img.src);
      flashT('bad', 'noRead');
    }
  };

  img.onerror = function () { URL.revokeObjectURL(img.src); flashT('bad', 'noRead'); };
  img.src = URL.createObjectURL(f);
};

$('manForm').onsubmit = function (e) {
  e.preventDefault();
  var v = $('manual').value.trim();
  if (!v) return;
  lastText = '';
  onScan(v); $('manual').value = ''; $('manHint').textContent = '';
};
$('manual').oninput = function () {
  var d = $('manual').value.replace(/[^0-9]/g, '');
  if (d.length >= 18) {
    $('manHint').innerHTML = gs1Ok(d)
      ? '<span style="color:var(--ok)">&#10003;</span>'
      : '<span style="color:var(--bad)">&#10007; ' + esc(t('check')) + '</span>';
  } else {
    $('manHint').textContent = d.length ? d.length + '/18' : '';
  }
};

$('abrListe').oninput = function (ev) {
  var el = ev.target, i = el && el.dataset ? Number(el.dataset.i) : NaN;
  if (!(i >= 0) || !abr.beutel[i]) return;
  abr.beutel[i].text = el.value;
  abr.rid = '';
  el.classList.toggle('falsch', el.value.trim() !== '' && betragLesen(el.value) === null);
  abrSummeZeichnen();
};
$('abrListe').onclick = function (ev) {
  var el = ev.target, i = el && el.dataset && el.dataset.rm !== undefined ? Number(el.dataset.rm) : NaN;
  if (!(i >= 0) || !abr.beutel[i] || arbeitet) return;
  abr.beutel.splice(i, 1);
  abr.rid = '';
  lastText = '';
  abrListeZeichnen();
  abrSummeZeichnen();
};

$('uebListe').onclick = function (ev) {
  var weg = ev.target && ev.target.dataset ? ev.target.dataset.weg : undefined;
  if (!weg || arbeitet) return;
  ueb.haken = ueb.haken.filter(function (x) { return !gleich(x, weg); });
  ueb.rid = '';
  lastText = '';
  uebZeichnen();
};
$('startDatum').onchange = function () { abr.rid = ''; abr.leerRid = ''; };
$('notizAbr').oninput = function () { abr.notiz = $('notizAbr').value; abr.rid = ''; abr.leerRid = ''; };
$('notizUeb').oninput = function () { ueb.notiz = $('notizUeb').value; ueb.rid = ''; };
$('btnBuchen').onclick = abrBuchenFragen;
$('btnLeer').onclick = leerFragen;
$('btnLeerZurueck').onclick = leerZurueckFragen;
$('btnUebBuchen').onclick = uebBuchen;

var REITER = { abr:'tabAbr', ueb:'tabUeb', tresor:'tresor' };
function modusSetzen(neu) {
  mode = REITER[neu] ? neu : 'abr';
  if (stream) stopCam();
  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (x) {
    x.classList.toggle('sel', x.dataset.mode === mode);
  });
  show($('mAbr'), istFiliale() && mode === 'abr');
  show($('mUeb'), istFiliale() && mode === 'ueb');
  show($('mTresor'), istFiliale() && mode === 'tresor');
  if (mode !== 'tresor') $(mode === 'ueb' ? 'platzUeb' : 'platzAbr').appendChild($('scanBox'));
  show($('scanBox'), istFiliale() && mode !== 'tresor');
  lastText = '';
}
Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
  b.onclick = function () {
    if (arbeitet) return;
    modusSetzen(b.dataset.mode);
    hinweis(REITER[mode]);

    if (stand) laden(true, true); else laden(true);
  };
});

function rolleRichten() {
  var ja = istFiliale();
  show($('nav'), ja);
  show($('btnLaden'), ja);
  show($('nurFiliale'), !ja);
  modusSetzen(mode);
}

$('btnLaden').onclick = function () {
  if (laedt || arbeitet) return;
  var b = $('btnLaden');
  laedt = true;
  b.disabled = true;

  warten('laedt');
  laden().then(function (ok) {
    laedt = false;
    b.disabled = false;
    ladenFertig();
    if (ok) flashT('ok', 'reload');
    autoPlanen();
  });
};
$('lang').onclick = function () { lang = lang === 'zh' ? 'de' : 'zh'; ls(K.lang, lang); applyLang(); };

function autoPlanen(ms) {
  if (autoUhr) clearTimeout(autoUhr);
  autoUhr = 0;
  if (!(syncSek > 0)) return;
  autoUhr = setTimeout(autoTick, ms === undefined ? syncSek * 1000 : ms);
}
function autoTick() {
  autoUhr = 0;
  var a = document.activeElement;
  var still = !cfg.tok || !istFiliale() || document.hidden || navigator.onLine === false ||
              arbeitet || laedt || sucht || fotoLaeuft || dialogOffen ||
              (!!a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA'));
  if (still) { autoPlanen(); return; }
  laden(true, true).then(function () { autoPlanen(); });
}

document.addEventListener('visibilitychange', function () {
  if (document.hidden) return;
  autoPlanen(500);
  if (Date.now() - versionZuletzt > 60000) versionPruefen();
});
window.addEventListener('online', function () { setNet(true); autoPlanen(500); });
window.addEventListener('offline', function () { setNet(false); });

var BUILD = '0f7107d290d3';
var VERSION_TAKT = 600000, VERSION_FRIST = 900000;
var versionUhr = 0, versionZiel = '', neuUhr = 0, versionZuletzt = 0;

function versionPruefen() {
  if (!/^[0-9a-f]{8,}$/.test(BUILD) || navigator.onLine === false || document.hidden) return Promise.resolve();
  versionZuletzt = Date.now();
  return mitFrist(fetch('version.txt?' + Date.now(), { cache:'no-store' })
    .then(function (r) { return r.ok ? r.text() : ''; }), 8000)
    .then(function (text) {
      var neu = String(text || '').trim();
      if (/^[0-9a-f]{8,}$/.test(neu) && neu !== BUILD) { versionZiel = neu; neuLaden(); }
    }).catch(function () {});
}
function versionPlanen() {
  if (versionUhr) clearTimeout(versionUhr);
  versionUhr = setTimeout(function () { versionUhr = 0; versionPruefen().then(versionPlanen); }, VERSION_TAKT);
}

function ruhig() {
  return !arbeitet && !sucht && !laedt && !pairBusy && !stream && !dialogOffen && !fotoLaeuft &&
         ($('setup').classList.contains('hide') || !$('cfgCode').value) &&
         !abr.fotos.length && !abr.beutel.length && !ueb.fotos.length && !ueb.haken.length &&
         !abr.notiz.trim() && !ueb.notiz.trim();
}
function neuLaden() {
  if (neuUhr) { clearTimeout(neuUhr); neuUhr = 0; }
  if (!versionZiel) return;

  var merk = ls(K.versuch) || {};
  if (merk.ziel === versionZiel && Date.now() - (Number(merk.at) || 0) < VERSION_FRIST) return;
  if (!ruhig() || document.hidden || navigator.onLine === false) { neuUhr = setTimeout(neuLaden, 3000); return; }
  ls(K.versuch, { ziel:versionZiel, at:Date.now() });
  ls(K.neu, versionZiel);
  location.reload();
}

function openSetup(on) {
  if (on && stream) stopCam();
  show($('setup'), on); show($('app'), !on);
  if (!on) return;
  $('cfgCode').value = '';
  show($('pairBox'), !cfg.tok);
  show($('doneBox'), !!cfg.tok);
  $('meName').textContent = filialName();
  $('meRole').textContent = cfg.rolle || '';
}
$('gear').onclick = function () {
  if (arbeitet) return;
  var zu = $('setup').classList.contains('hide');
  if (!zu && !cfg.tok) return;
  openSetup(zu);
};

function setPairBusy(on) {
  pairBusy = on;
  var b = $('cfgPair');
  b.disabled = on;
  b.innerHTML = on ? SPINNER : esc(t('save'));
  $('cfgCode').disabled = on;
}

$('cfgPair').onclick = function () {
  if (pairBusy) return;

  var code = $('cfgCode').value.trim().toUpperCase();
  if (!apiOk(cfg.api) || !code) { $('cfgMsg').textContent = t('pairFail'); return; }
  $('cfgMsg').textContent = '';
  setPairBusy(true);
  apiPost('pair', { code:code }).then(function (d) {
    setPairBusy(false);

    if (!d || !d.ok) { $('cfgMsg').textContent = t('pairFail'); return; }
    cfg.tok = d.token; cfg.who = d.who || ''; cfg.rolle = d.role || ''; cfg.filiale = d.filiale || null;
    ls(K.cfg, cfg);
    boot();
  }, function () {
    setPairBusy(false);
    $('cfgMsg').textContent = t('pairFail');
  });
};

$('cfgUnpair').onclick = function () {
  cfg.tok = ''; cfg.who = ''; cfg.rolle = ''; cfg.filiale = null; ls(K.cfg, cfg);
  stand = null; abr = neueAbrechnung(); ueb = neueUebergabe();
  kopfZeigen();
  openSetup(true);
};

$('cfgCode').oninput = function () {
  this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
};

function werBinIch() {
  return apiGet('whoami').then(function (d) {
    if (!d || !d.ok) return;
    cfg.rolle = d.role || '';
    cfg.who = d.who || cfg.who;
    cfg.filiale = d.filiale || null;
    ls(K.cfg, cfg);
  }, function () {});
}

function boot() {
  openSetup(false);
  warten('laedt');

  var neu = ls(K.neu);
  nachDemLaden = null;
  if (neu) { ls(K.neu, ''); if (neu === BUILD) nachDemLaden = { kind:'ok', key:'updated', a:'', b:'', bKey:'' }; }
  kopfZeigen();
  rolleRichten();
  applyLang();
  return werBinIch().then(function () {
    if (!cfg.tok) return;
    kopfZeigen();
    rolleRichten();
    return laden();
  }).then(function () { ladenFertig(); autoPlanen(); });
}

lang = ls(K.lang) || ((navigator.language || '').slice(0, 2) === 'zh' ? 'zh' : 'de');
setNet(navigator.onLine !== false);
if (cfg.api && cfg.tok) {
  boot();
} else {
  openSetup(true);
  applyLang();
}
versionPlanen();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
